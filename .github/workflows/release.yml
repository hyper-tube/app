name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.read.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - id: read
        name: Read it from the project
        run: |
          value=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          if [ -z "$value" ]; then
            echo "no VERSION in the top level project() call" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$value" ]; then
            echo "tag $GITHUB_REF_NAME does not name project version $value" >&2
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.value }}

  windows:
    needs: version
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.value }}

  macos:
    needs: version
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.value }}

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: release
          pattern: package-*
          merge-multiple: true

      - name: Generate the checksums
        working-directory: release
        run: |
          sha256sum * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" .
          cat SHA256SUMS

      - id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --latest --strip header --offline
        env:
          GITHUB_REPO: ${{ github.repository }}

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.version.outputs.value }}
          body: ${{ steps.changelog.outputs.content }}
          files: release/*
          fail_on_unmatched_files: true
