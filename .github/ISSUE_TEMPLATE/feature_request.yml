name: Feature request
description: Suggest a new feature or an improvement to an existing one
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Search the existing issues first to see if it has already been suggested.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you'd like it to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any other solutions or workarounds you've considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, or examples of how other apps handle it.
